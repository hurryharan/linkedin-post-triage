<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>LinkedIn Post Triage</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab-btn active" data-tab="pending">Pending</button>
      <button class="tab-btn" data-tab="processed">Processed</button>
    </div>
    <div class="toolbar">
      <button id="scanBtn">Scan saved posts</button>
      <button id="classifyAllBtn">Classify all pending</button>
      <button id="offlineAiBtn" title="Classify via a pasted Claude/ChatGPT response, no API key needed">Offline AI</button>
      <button id="exportBtn">Export .xlsx</button>
      <button id="logsBtn" title="Debug logs">Logs</button>
      <button id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div id="logsPanel" class="logs-panel" hidden>
    <div class="logs-toolbar">
      <span>Debug log (newest last) — useful to copy/paste when reporting a bug.</span>
      <div class="btns">
        <button id="logsCopyBtn" class="small">Copy</button>
        <button id="logsClearBtn" class="small">Clear</button>
        <button id="logsCloseBtn" class="small">Close</button>
      </div>
    </div>
    <pre id="logsContent" class="logs-content"></pre>
  </div>

  <div id="offlinePanel" class="offline-panel" hidden>
    <div class="offline-step">
      <div class="offline-toolbar">
        <span>1. Copy this prompt into Claude or ChatGPT.</span>
        <div class="btns">
          <button id="offlineCopyBtn" class="small">Copy</button>
          <button id="offlineCloseBtn" class="small">Close</button>
        </div>
      </div>
      <textarea id="offlinePromptEl" class="offline-textarea" readonly></textarea>
    </div>
    <div class="offline-step">
      <div class="offline-toolbar">
        <span>2. Paste its reply here, then apply.</span>
        <div class="btns">
          <button id="offlineApplyBtn" class="small primary">Apply</button>
        </div>
      </div>
      <textarea id="offlinePasteEl" class="offline-textarea" placeholder="Paste the JSON response here…"></textarea>
    </div>
  </div>

  <div id="list" class="list"></div>

  <!-- Vendored SheetJS (Apache-2.0, see vendor/XLSX-LICENSE), classic script for the global XLSX. -->
  <script src="../../vendor/xlsx.core.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
